<!DOCTYPE html>
<html>
<head>
    <title>漢字</title>
    <style>
        .main {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            font-size: 24px;
        }

        .readings {
            text-align: center;
        }

        input {
            font-size: 24px;
        }
    </style>
</head>
<body>
    <div class="main">
        <div id="kanji"></div>
        <div id="readings" class="readings"></div>
        <form id="form">
            <input type="text" name="input" id="input" autofocus>
        </form>
    </div>
    <script>
        let data = [];

        const model = {
            current: 0,
            found: new Set(),
        };

        const form = document.getElementById("form");

        const get_both_readings = () => (
            [ ...data[model.current][1].on, 
              ...data[model.current][1].kun ]
        );

        const update_model = () => {
            if (model.found.size == get_both_readings().length) {
                model.current = (model.current + 1) % data.length;
                model.found = new Set();
            }

            const kanji_elem = document.getElementById("kanji");
            kanji_elem.textContent = data[model.current][0];

            const both_readings = get_both_readings();
            const found = [];
            for (reading of both_readings) {
                const value = model.found.has(reading) ? reading : "?";
                found.push(value);
            }

            const readings_elem = document.getElementById("readings");
            readings_elem.innerHTML = found.join("<br>");
        };

        form.addEventListener("submit", (event) => {
            event.preventDefault();
            event.stopPropagation();

            const input = document.getElementById("input");

            const both = get_both_readings();

            if (both.includes(input.value)) {
                model.found.add(input.value);
                update_model();
            } else {
                console.log("nop");
            }

            input.value = "";

            event.preventDefault();
            event.stopPropagation();
            return false;
        });

        fetch("data.json")
            .catch((error) => console.log("Error while loading data: ", error))
            .then((response) => data = response.json())
            .catch((error) => console.log("Parse error: ", error))
            .then((value) => {
                data = value.data;
                update_model();
            })
            .catch((error) => console.log("Update model: ", error));

    </script>
</body>
</html>
