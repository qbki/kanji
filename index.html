<!DOCTYPE html>
<html>
<head>
    <title>漢字</title>
    <style>
        .main {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            font-size: 24px;
        }

        .readings {
            text-align: center;
        }

        input {
            font-size: 24px;
        }
    </style>
    <link rel="stylesheet" href="components/ReadingChip/style.css">
    <script type="module" defer src="components/ReadingChip/script.js"></script>
</head>
<body>
    <div class="main">
        <div id="kanji"></div>
        <div id="readings" class="readings"></div>
        <form id="form">
            <input type="text" name="input" id="input" autofocus>
        </form>
    </div>
    <script>
        let data = [];

        const model = {
            current: 0,
            found: new Set(),
        };

        const form = document.getElementById("form");

        const get_both_readings = () => (
            [ ...data[model.current][1].on, 
              ...data[model.current][1].kun ]
        );

        const init_model = () => {
            const kanji_elem = document.getElementById("kanji");
            kanji_elem.textContent = data[model.current][0];

            const both_readings = get_both_readings();
            const found = [];
            for (reading of both_readings) {
                found.push(`<reading-chip value=${reading}></reading-chip>`);
            }

            const readings_elem = document.getElementById("readings");
            readings_elem.innerHTML = found.join("<br>");
        };

        const update_model = () => {
            if (model.found.size == get_both_readings().length) {
                model.current = (model.current + 1) % data.length;
                model.found = new Set();
                init_model();
            }
        };

        form.addEventListener("submit", (event) => {
            const input = document.getElementById("input");
            const inputValue = input.value;

            for (const elem of document.querySelectorAll('reading-chip')) {
                if (elem.value === inputValue) {
                    elem.solve();
                    model.found.add(inputValue);
                    break;
                }
            }
            update_model();

            input.value = "";

            event.preventDefault();
            event.stopPropagation();
            return false;
        });

        fetch("data.json")
            .catch((error) => console.log("Error while loading data: ", error))
            .then((response) => data = response.json())
            .catch((error) => console.log("Parse error: ", error))
            .then((value) => {
                data = value.data;
                init_model();
                update_model();
            })
            .catch((error) => console.log("Update model: ", error));

    </script>
</body>
</html>
